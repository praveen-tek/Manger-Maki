<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
</head>
<body>

  <div class="wallpaper-container" id="wallpaperContainer"></div>

  <div class="content">

    <div class="header">
      <div class="filters" id="filters"></div>
      <div class="header-right">
        <button class="icon-btn" id="settingsBtn" title="Settings"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="16" height="16" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Zm88-29.84q.06-2.16,0-4.32l14.92-18.64a8,8,0,0,0,1.48-7.06,107.21,107.21,0,0,0-10.88-26.25,8,8,0,0,0-6-3.93l-23.72-2.64q-1.48-1.56-3-3L186,40.54a8,8,0,0,0-3.94-6,107.71,107.71,0,0,0-26.25-10.87,8,8,0,0,0-7.06,1.49L130.16,40Q128,40,125.84,40L107.2,25.11a8,8,0,0,0-7.06-1.48A107.6,107.6,0,0,0,73.89,34.51a8,8,0,0,0-3.93,6L67.32,64.27q-1.56,1.49-3,3L40.54,70a8,8,0,0,0-6,3.94,107.71,107.71,0,0,0-10.87,26.25,8,8,0,0,0,1.49,7.06L40,125.84Q40,128,40,130.16L25.11,148.8a8,8,0,0,0-1.48,7.06,107.21,107.21,0,0,0,10.88,26.25,8,8,0,0,0,6,3.93l23.72,2.64q1.49,1.56,3,3L70,215.46a8,8,0,0,0,3.94,6,107.71,107.71,0,0,0,26.25,10.87,8,8,0,0,0,7.06-1.49L125.84,216q2.16.06,4.32,0l18.64,14.92a8,8,0,0,0,7.06,1.48,107.21,107.21,0,0,0,26.25-10.88,8,8,0,0,0,3.93-6l2.64-23.72q1.56-1.48,3-3L215.46,186a8,8,0,0,0,6-3.94,107.71,107.71,0,0,0,10.87-26.25,8,8,0,0,0-1.49-7.06Zm-16.1-6.5a73.93,73.93,0,0,1,0,8.68,8,8,0,0,0,1.74,5.48l14.19,17.73a91.57,91.57,0,0,1-6.23,15L187,173.11a8,8,0,0,0-5.1,2.64,74.11,74.11,0,0,1-6.14,6.14,8,8,0,0,0-2.64,5.1l-2.51,22.58a91.32,91.32,0,0,1-15,6.23l-17.74-14.19a8,8,0,0,0-5-1.75h-.48a73.93,73.93,0,0,1-8.68,0,8,8,0,0,0-5.48,1.74L100.45,215.8a91.57,91.57,0,0,1-15-6.23L82.89,187a8,8,0,0,0-2.64-5.1,74.11,74.11,0,0,1-6.14-6.14,8,8,0,0,0-5.1-2.64L46.43,170.6a91.32,91.32,0,0,1-6.23-15l14.19-17.74a8,8,0,0,0,1.74-5.48,73.93,73.93,0,0,1,0-8.68,8,8,0,0,0-1.74-5.48L40.2,100.45a91.57,91.57,0,0,1,6.23-15L69,82.89a8,8,0,0,0,5.1-2.64,74.11,74.11,0,0,1,6.14-6.14A8,8,0,0,0,82.89,69L85.4,46.43a91.32,91.32,0,0,1,15-6.23l17.74,14.19a8,8,0,0,0,5.48,1.74,73.93,73.93,0,0,1,8.68,0,8,8,0,0,0,5.48-1.74L155.55,40.2a91.57,91.57,0,0,1,15,6.23L173.11,69a8,8,0,0,0,2.64,5.1,74.11,74.11,0,0,1,6.14,6.14,8,8,0,0,0,5.1,2.64l22.58,2.51a91.32,91.32,0,0,1,6.23,15l-14.19,17.74A8,8,0,0,0,199.87,123.66Z"/></svg></button>
      </div>
    </div>

    <div class="main">
      <div id="bookmarksList"></div>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon" id="emptyIcon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="36" height="36" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M216,72H131.31L104,44.69A15.86,15.86,0,0,0,92.69,40H40A16,16,0,0,0,24,56V200.62A15.4,15.4,0,0,0,39.38,216H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72ZM40,56H92.69l16,16H40ZM216,200H40V88H216Z"/></svg></div>
        <div class="empty-text">No bookmarks found</div>
        <button class="btn btn-secondary" id="addBookmarkBtn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="13" height="13" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg> Add first bookmark</button>
      </div>
    </div>

    <button class="fab" id="addBtn" title="Add Bookmark (Ctrl+K)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="22" height="22" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg></button>

  </div>

  <!-- Add Bookmark Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="addModalTitle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="15" height="15" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg> Add Bookmark</h2>
        <button class="modal-close" id="closeAddModal" title="Close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="16" height="16" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="urlInput">URL</label>
          <input type="text" class="form-input" id="urlInput" placeholder="https://example.com" spellcheck="false" autocomplete="off">
          <div class="form-error" id="urlError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="titleInput">Title</label>
          <input type="text" class="form-input" id="titleInput" placeholder="Example" spellcheck="false">
          <div class="form-error" id="titleError"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Tags</label>
          <div id="tagList" class="tag-grid"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Group</label>
          <div id="groupList" class="tag-grid"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelAddBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBookmarkBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal modal-large">
      <div class="modal-header">
        <h2 id="settingsModalTitle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="15" height="15" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Zm88-29.84q.06-2.16,0-4.32l14.92-18.64a8,8,0,0,0,1.48-7.06,107.21,107.21,0,0,0-10.88-26.25,8,8,0,0,0-6-3.93l-23.72-2.64q-1.48-1.56-3-3L186,40.54a8,8,0,0,0-3.94-6,107.71,107.71,0,0,0-26.25-10.87,8,8,0,0,0-7.06,1.49L130.16,40Q128,40,125.84,40L107.2,25.11a8,8,0,0,0-7.06-1.48A107.6,107.6,0,0,0,73.89,34.51a8,8,0,0,0-3.93,6L67.32,64.27q-1.56,1.49-3,3L40.54,70a8,8,0,0,0-6,3.94,107.71,107.71,0,0,0-10.87,26.25,8,8,0,0,0,1.49,7.06L40,125.84Q40,128,40,130.16L25.11,148.8a8,8,0,0,0-1.48,7.06,107.21,107.21,0,0,0,10.88,26.25,8,8,0,0,0,6,3.93l23.72,2.64q1.49,1.56,3,3L70,215.46a8,8,0,0,0,3.94,6,107.71,107.71,0,0,0,26.25,10.87,8,8,0,0,0,7.06-1.49L125.84,216q2.16.06,4.32,0l18.64,14.92a8,8,0,0,0,7.06,1.48,107.21,107.21,0,0,0,26.25-10.88,8,8,0,0,0,3.93-6l2.64-23.72q1.56-1.48,3-3L215.46,186a8,8,0,0,0,6-3.94,107.71,107.71,0,0,0,10.87-26.25,8,8,0,0,0-1.49-7.06Zm-16.1-6.5a73.93,73.93,0,0,1,0,8.68,8,8,0,0,0,1.74,5.48l14.19,17.73a91.57,91.57,0,0,1-6.23,15L187,173.11a8,8,0,0,0-5.1,2.64,74.11,74.11,0,0,1-6.14,6.14,8,8,0,0,0-2.64,5.1l-2.51,22.58a91.32,91.32,0,0,1-15,6.23l-17.74-14.19a8,8,0,0,0-5-1.75h-.48a73.93,73.93,0,0,1-8.68,0,8,8,0,0,0-5.48,1.74L100.45,215.8a91.57,91.57,0,0,1-15-6.23L82.89,187a8,8,0,0,0-2.64-5.1,74.11,74.11,0,0,1-6.14-6.14,8,8,0,0,0-5.1-2.64L46.43,170.6a91.32,91.32,0,0,1-6.23-15l14.19-17.74a8,8,0,0,0,1.74-5.48,73.93,73.93,0,0,1,0-8.68,8,8,0,0,0-1.74-5.48L40.2,100.45a91.57,91.57,0,0,1,6.23-15L69,82.89a8,8,0,0,0,5.1-2.64,74.11,74.11,0,0,1,6.14-6.14A8,8,0,0,0,82.89,69L85.4,46.43a91.32,91.32,0,0,1,15-6.23l17.74,14.19a8,8,0,0,0,5.48,1.74,73.93,73.93,0,0,1,8.68,0,8,8,0,0,0,5.48-1.74L155.55,40.2a91.57,91.57,0,0,1,15,6.23L173.11,69a8,8,0,0,0,2.64,5.1,74.11,74.11,0,0,1,6.14,6.14,8,8,0,0,0,5.1,2.64l22.58,2.51a91.32,91.32,0,0,1,6.23,15l-14.19,17.74A8,8,0,0,0,199.87,123.66Z"/></svg> Settings</h2>
        <button class="modal-close" id="closeSettingsModal" title="Close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="16" height="16" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></button>
      </div>
      <div class="modal-body">

        <!-- WALLPAPER -->
        <div class="settings-section">
          <h3 id="sectionWallpaperTitle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="14" height="14" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M64,105V40a8,8,0,0,0-16,0v65a32,32,0,0,0,0,62v49a8,8,0,0,0,16,0V167a32,32,0,0,0,0-62Zm-8,47a16,16,0,1,1,16-16A16,16,0,0,1,56,152Zm80-95V40a8,8,0,0,0-16,0V57a32,32,0,0,0,0,62v97a8,8,0,0,0,16,0V119a32,32,0,0,0,0-62Zm-8,47a16,16,0,1,1,16-16A16,16,0,0,1,128,104Zm104,64a32.06,32.06,0,0,0-24-31V40a8,8,0,0,0-16,0v97a32,32,0,0,0,0,62v17a8,8,0,0,0,16,0V199A32.06,32.06,0,0,0,232,168Zm-32,16a16,16,0,1,1,16-16A16,16,0,0,1,200,184Z"/></svg> Wallpaper</h3>
          <div class="wallpaper-options">
            <div class="wallpaper-preview" id="wallpaperPreview"></div>
            <div class="wallpaper-controls">
              <div class="form-group">
                <label class="form-label" for="wallpaperInput">Wallpaper URL</label>
                <div style="display:flex;gap:8px;">
                  <input type="text" class="form-input" id="wallpaperInput" placeholder="https://example.com/image.jpg" spellcheck="false" style="flex:1;">
                  <button class="btn btn-secondary" id="applyWallpaperBtn">Apply</button>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="wallpaperUpload">Or upload image / video</label>
                <input type="file" class="form-input" id="wallpaperUpload" accept="image/*,video/*">
              </div>
              <button class="btn btn-secondary" id="resetWallpaperBtn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="13" height="13" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M224,128a96,96,0,0,1-94.71,96H128A95.38,95.38,0,0,1,62.1,197.8a8,8,0,0,1,11-11.63A80,80,0,1,0,71.43,71.39a3.07,3.07,0,0,1-.26.25L44.59,96H72a8,8,0,0,1,0,16H24a8,8,0,0,1-8-8V56a8,8,0,0,1,16,0V85.8L60.25,60A96,96,0,0,1,224,128Z"/></svg> Reset</button>
            </div>
          </div>
        </div>

        <!-- GROUPS -->
        <div class="settings-section">
          <h3 id="sectionGroupsTitle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="14" height="14" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M216,72H131.31L104,44.69A15.86,15.86,0,0,0,92.69,40H40A16,16,0,0,0,24,56V200.62A15.4,15.4,0,0,0,39.38,216H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72ZM40,56H92.69l16,16H40ZM216,200H40V88H216Z"/></svg> Groups</h3>
          <div id="groupManager" class="group-manager"></div>
          <div class="add-row" style="margin-top:10px;">
            <input type="text" class="form-input" id="newGroupInput" placeholder="New group name" style="flex:1;">
            <button class="btn btn-secondary" id="addGroupBtn">Add</button>
          </div>
        </div>

        <!-- BOOKMARKS LIST -->
        <div class="settings-section">
          <h3 id="sectionBookmarksTitle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="14" height="14" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M243.31,136,144,36.69A15.86,15.86,0,0,0,132.69,32H40a8,8,0,0,0-8,8v92.69A15.86,15.86,0,0,0,36.69,144L136,243.31a16,16,0,0,0,22.63,0l84.68-84.68a16,16,0,0,0,0-22.63Zm-96,96L48,132.69V48h84.69L232,147.31ZM96,84A12,12,0,1,1,84,72,12,12,0,0,1,96,84Z"/></svg> Bookmarks</h3>
          <div id="settingsBookmarksList" class="settings-bookmarks-list"></div>
        </div>

        <!-- CUSTOMIZE -->
        <div class="settings-section">
          <h3 id="sectionCustomizeTitle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="14" height="14" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M64,105V40a8,8,0,0,0-16,0v65a32,32,0,0,0,0,62v49a8,8,0,0,0,16,0V167a32,32,0,0,0,0-62Zm-8,47a16,16,0,1,1,16-16A16,16,0,0,1,56,152Zm80-95V40a8,8,0,0,0-16,0V57a32,32,0,0,0,0,62v97a8,8,0,0,0,16,0V119a32,32,0,0,0,0-62Zm-8,47a16,16,0,1,1,16-16A16,16,0,0,1,128,104Zm104,64a32.06,32.06,0,0,0-24-31V40a8,8,0,0,0-16,0v97a32,32,0,0,0,0,62v17a8,8,0,0,0,16,0V199A32.06,32.06,0,0,0,232,168Zm-32,16a16,16,0,1,1,16-16A16,16,0,0,1,200,184Z"/></svg> Customize</h3>

          <!-- Typography -->
          <div class="cust-sub-label">Typography</div>

          <div class="cust-row">
            <label class="cust-label" for="custFontSize">
              Font Size <span class="cust-val" id="custFontSizeVal">13px</span>
            </label>
            <input type="range" class="cust-slider" id="custFontSize" min="10" max="18" step="1" value="13">
          </div>

          <div class="cust-row">
            <label class="cust-label">Font Color</label>
            <div class="cust-color-row">
              <input type="color" class="cust-color-input" id="custFontColor" value="#ffffff" title="Custom color">
              <button class="cust-swatch" data-color="#ffffff" style="background:#ffffff;" title="#ffffff"></button>
              <button class="cust-swatch" data-color="#f5f0e8" style="background:#f5f0e8;" title="Warm white"></button>
              <button class="cust-swatch" data-color="rgba(255,255,255,0.6)" style="background:rgba(255,255,255,0.6);" title="Muted"></button>
              <button class="cust-swatch" data-color="#f5c842" style="background:#f5c842;" title="Amber"></button>
              <button class="cust-swatch" data-color="#a8c5a0" style="background:#a8c5a0;" title="Soft green"></button>
              <button class="cust-swatch" data-color="#e8a0a0" style="background:#e8a0a0;" title="Soft red"></button>
            </div>
          </div>

          <div class="cust-row">
            <label class="cust-label">Font Weight</label>
            <div class="cust-toggle-group" id="custFontWeight">
              <button class="cust-toggle-btn" data-val="normal">Regular</button>
              <button class="cust-toggle-btn active" data-val="bold">Bold</button>
            </div>
          </div>

          <div class="cust-row">
            <label class="cust-label">Text Transform</label>
            <div class="cust-toggle-group" id="custTextTransform">
              <button class="cust-toggle-btn active" data-val="uppercase">Upper</button>
              <button class="cust-toggle-btn" data-val="lowercase">Lower</button>
              <button class="cust-toggle-btn" data-val="none">None</button>
            </div>
          </div>

          <div class="cust-row">
            <label class="cust-label" for="custSpacing">
              Letter Spacing <span class="cust-val" id="custSpacingVal">0.2px</span>
            </label>
            <input type="range" class="cust-slider" id="custSpacing" min="0" max="3" step="0.1" value="0.2">
          </div>

          <!-- Tags -->
          <div class="cust-sub-label" style="margin-top:18px;">Tags</div>
          <div class="cust-tag-pills" id="custTagPills"></div>
          <div class="add-row">
            <input type="text" class="form-input" id="custNewTagInput" placeholder="New tag name" maxlength="20" style="flex:1;">
            <button class="btn btn-secondary" id="custAddTagBtn">Add</button>
          </div>
          <div class="form-error" id="custTagError"></div>

          <!-- Layout -->
          <div class="cust-sub-label" style="margin-top:18px;">Layout</div>

          <div class="cust-row">
            <label class="cust-label">Columns</label>
            <div class="cust-toggle-group" id="custColumns">
              <button class="cust-toggle-btn" data-val="2">2</button>
              <button class="cust-toggle-btn" data-val="3">3</button>
              <button class="cust-toggle-btn active" data-val="4">4</button>
            </div>
          </div>

          <div class="cust-row">
            <label class="cust-label">Compact Mode</label>
            <div class="cust-toggle-group" id="custCompact">
