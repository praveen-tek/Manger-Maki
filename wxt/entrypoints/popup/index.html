<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manger-Maki</title>
</head>
<body>
  <div class="popup">
    <div class="popup-header">
      <span class="popup-title" id="headerTitle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="14" height="14" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M243.31,136,144,36.69A15.86,15.86,0,0,0,132.69,32H40a8,8,0,0,0-8,8v92.69A15.86,15.86,0,0,0,36.69,144L136,243.31a16,16,0,0,0,22.63,0l84.68-84.68a16,16,0,0,0,0-22.63Zm-96,96L48,132.69V48h84.69L232,147.31ZM96,84A12,12,0,1,1,84,72,12,12,0,0,1,96,84Z"/></svg>
        Add Bookmark
      </span>
      <span class="popup-mark">MANGER-MAKI</span>
    </div>

    <div class="field">
      <label class="field-label" for="popupUrl">URL</label>
      <input type="text" class="field-input" id="popupUrl" placeholder="https://example.com" spellcheck="false" autocomplete="off">
    </div>

    <div class="field">
      <label class="field-label" for="popupTitle">Title</label>
      <input type="text" class="field-input" id="popupTitle" placeholder="Page title" spellcheck="false">
    </div>

    <div class="field">
      <label class="field-label" for="popupGroup">Group</label>
      <select class="field-input" id="popupGroup">
        <option value="">None</option>
      </select>
    </div>

    <div class="tags-section">
      <div class="tags-label">Tags</div>
      <div class="tag-grid" id="popupTagGrid"></div>
    </div>

    <div class="popup-footer">
      <span class="status-text" id="popupStatus"></span>
      <button class="save-btn" id="popupSaveBtn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="13" height="13" fill="currentColor" class="ph-icon" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg>
        Save
      </button>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
